[project]
name = "product-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.140.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest-benchmark>=5.2.3",
    "ruff>=0.16.2",
]
[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = ["B008", "DTZ003"]

[tool.ruff.lint.per-file-ignores]
"models/__init__.py" = ["F401"]

[tool.setuptools.packages.find]
include = ["models*", "database*"]
exclude = ["screenshots*", "tests*"]
